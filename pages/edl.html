<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extreme Demon Ranking - lexy's Rankings</title>
  <link rel="icon" type="image/x-icon" href="../media/favicon.ico">
  <link rel="stylesheet" href="../css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>

<body data-page="edl">
  <nav class="nav-edl" aria-label="Main Navigation">
    <a href="../index.html" class="logo-link" aria-label="Go to homepage">
      <svg class="nav-logo" width="36" height="36" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true" focusable="false">
        <path d="M1 6V15H6V11C6 9.89543 6.89543 9 8 9C9.10457 9 10 9.89543 10 11V15H15V6L8 0L1 6Z" fill="#FFFFFF" />
      </svg>
    </a>
    <div class="nav-links">
      <a href="mdl.html">Medium Demon List</a>
      <a href="hdl.html">Hard Demon List</a>
      <a href="idl.html">Insane Demon List</a>
      <a href="edl.html" aria-current="page">All Rated Extreme Demon List</a>
      <a href="add-level.html">Add Level</a>
      <span class="version">v5.0.0</span>
    </div>
  </nav>

  <main class="container layout-grid">
    <section class="list-section">
      <h1>Extreme Demon Ranking</h1>

      <div class="search-controls">
        <label for="level-search">Search Level</label>
        <input type="search" id="level-search" autocomplete="off">
      </div>

      <div class="sort-controls">
        <label for="sort-select">Sort by</label>
        <select id="sort-select">
          <option value="difficulty-desc" selected>Difficulty: high to low</option>
          <option value="difficulty-asc">Difficulty: low to high</option>
          <option value="score-desc">Score: high to low</option>
          <option value="score-asc">Score: low to high</option>
          <option value="attempts-desc">Attempts: high to low</option>
          <option value="attempts-asc">Attempts: low to high</option>
        </select>
      </div>

      <p id="results-status" class="results-status" role="status"></p>

      <ul id="ranking-list" class="ranking-list">

      </ul>
    </section>

    <section class="preview-section" aria-live="polite">
      <div id="preview-content" class="preview-content">
        <p class="preview-empty"><em>crickets</em></p>
      </div>
    </section>
  </main>

  <script src="../script/script.js"></script>
</body>

</html>
